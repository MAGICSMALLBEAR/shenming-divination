# fly.toml — Fly.io deployment for shenming-divination backend
# Deploy with: fly launch / fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "shenming-divination-api"
primary_region = "nrt"   # Tokyo (closest to Taiwan)

[build]
  # Uses Dockerfile in this directory

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle (cost saving)

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
